name: Optimize startup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: "!contains(github.event.head_commit.message, 'Remove startup loader')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove blocking startup loader
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text2, n = re.subn(r'<div aria-hidden="true" id="loader">.*?</div>\s*</div>\s*</body>', '</body>', text, count=1, flags=re.S)
          if n != 1:
              text2, n = re.subn(r'<div aria-hidden="true" id="loader">.*?</div>\s*</nav>', '</nav>', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Loader markup not found; refusing to modify index.html')
          index.write_text(text2, encoding='utf-8')

          main = Path('src/main.js')
          js = main.read_text(encoding='utf-8')
          old = "var loader=$('#loader'),pct=$('#loadPct'),t0=performance.now();\n(function tick(t){var p=clamp((t-t0)/1500,0,1),e=1-Math.pow(1-p,3);pct.textContent=String(Math.floor(e*100)).padStart(2,'0');if(p<1){requestAnimationFrame(tick)}else{setTimeout(function(){loader.classList.add('done');setTimeout(function(){loader.remove()},1100);typeHero();if(!sessionStorage.getItem('hint')){setTimeout(function(){toast('F = LIGHTS · ` = TERMINAL · ? = KEYS');sessionStorage.setItem('hint','1')},2000)}},250);}})(t0);"
          new = "typeHero();\nif(!sessionStorage.getItem('hint')){setTimeout(function(){toast('F = LIGHTS · ` = TERMINAL · ? = KEYS');sessionStorage.setItem('hint','1')},2000);}"
          if old not in js:
              raise SystemExit('Startup loader JS block not found; refusing to modify main.js')
          main.write_text(js.replace(old, new, 1), encoding='utf-8')

          wf = Path('.github/workflows/optimize-startup.yml')
          wf.unlink()

      - name: Commit optimized startup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/main.js .github/workflows/optimize-startup.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove startup loader and speed first paint"
          git push