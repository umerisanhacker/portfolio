<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umer Abdullah PV — Portfolio V2</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f5ead0;color:#171512;font-family:system-ui,sans-serif}.scene{position:fixed;inset:0}.hud{position:fixed;inset:0;padding:22px 24px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}.brand b{display:block;font-size:13px;letter-spacing:.16em}.brand span{font-size:11px;color:#6f6759}.hint{font-size:10px;color:#6f6759;text-align:right}.nav{position:fixed;left:24px;bottom:24px;z-index:6;display:flex;gap:8px;flex-wrap:wrap}.nav button{border:1px solid #aaa08d;background:#f5ead0cc;padding:9px 12px;border-radius:999px;font-size:10px;letter-spacing:.12em}.panel{position:fixed;right:24px;top:50%;transform:translateY(-50%);width:min(390px,calc(100vw - 48px));padding:25px;border:1px solid #aaa08d;background:#f5ead0e8;backdrop-filter:blur(16px);z-index:7;opacity:0;pointer-events:none;transition:.3s}.panel.open{opacity:1;pointer-events:auto}.panel h1{font-size:32px;line-height:1;margin:10px 0}.panel p{font-size:14px;line-height:1.7;color:#4d473d}.close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px}.cert{width:100%;margin-top:10px;border:1px solid #aaa08d}@media(max-width:650px){.hud{padding:16px}.hint{display:none}.nav{left:16px;bottom:16px}.panel{right:16px;bottom:74px;top:auto;transform:none;width:calc(100vw - 32px);max-height:65vh;overflow:auto}}</style></head><body><div id="scene" class="scene"></div><div class="hud"><div class="brand"><b>UMER ABDULLAH PV</b><span>CREATIVE DEVELOPER · DESIGNER</span></div><div class="hint">DRAG / SWIPE TO LOOK<br>CLICK A ROOM TO ENTER</div></div><nav class="nav"><button data-room="ABOUT">ABOUT</button><button data-room="WORK">WORK</button><button data-room="SKILLS">SKILLS</button><button data-room="CERTIFICATES">CERTIFICATES</button><button data-room="CONTACT">CONTACT</button></nav><section id="panel" class="panel"><button class="close" id="close">×</button><div id="body"></div></section><script type="module">import*as T from'https://unpkg.com/three@0.179.1/build/three.module.js';import{OrbitControls}from'https://unpkg.com/three@0.179.1/examples/jsm/controls/OrbitControls.js';const s=new T.Scene();s.background=new T.Color(0xf5ead0);s.fog=new T.Fog(0xf5ead0,18,45);const c=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);c.position.set(0,1.8,12);const r=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.6));r.setSize(innerWidth,innerHeight);r.outputColorSpace=T.SRGBColorSpace;scene.appendChild(r.domElement);const o=new OrbitControls(c,r.domElement);o.enableDamping=true;o.enablePan=false;o.minDistance=5;o.maxDistance=16;o.minPolarAngle=1.1;o.maxPolarAngle=2.0;s.add(new T.HemisphereLight(0xfff7e5,0x806f55,2.5));let l=new T.DirectionalLight(0xffffff,2);l.position.set(5,10,7);s.add(l);const m=x=>new T.MeshStandardMaterial({color:x,roughness:.8});function box(w,h,d,x,y,z,ma){let q=new T.Mesh(new T.BoxGeometry(w,h,d),ma);q.position.set(x,y,z);s.add(q);return q}box(12,7,.4,-6,3.5,-12,m(0xd6c4a0));box(12,7,.4,6,3.5,-12,m(0xd6c4a0));box(12,.3,40,0,0,-8,m(0xcbb994));const rooms=['ABOUT','WORK','SKILLS','CERTIFICATES','CONTACT'];const objs=[];rooms.forEach((name,i)=>{let z=6-i*8,a=box(5,4,.25,0,2.2,z,m(0x3d3427));a.userData.room=name;let b=box(4.5,3.5,.1,0,2.2,z-.2,m(0xf9f0dc));b.userData.room=name;objs.push(a,b)});const ray=new T.Raycaster(),mouse=new T.Vector2();function hit(e){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,c);let h=ray.intersectObjects(objs);return h[0]?.object?.userData.room}const panel=document.getElementById('panel'),body=document.getElementById('body');function openRoom(name){let text={ABOUT:['A PORTFOLIO BUILT AROUND CURIOSITY','A personal creative space for Umer Abdullah PV — design, development, visual work and experiments.'],WORK:['SELECTED WORK','Projects, videos, websites and interactive work can live here as physical rooms.'],SKILLS:['TOOLS & CRAFT','UI/UX · Front-end development · Visual design · Video editing · Digital marketing'],CERTIFICATES:['CERTIFICATE VAULT','Your certificates now live inside the experience.'],CONTACT:['LET’S BUILD SOMETHING','Use the contact options from the main portfolio.']}[name];body.innerHTML='<small>'+name+' · PORTFOLIO ROOM</small><h1>'+text[0]+'</h1><p>'+text[1]+'</p>'+(name==='CERTIFICATES'?'<img class="cert" src="assets/certificates/ui-ux-2026.svg"><img class="cert" src="assets/certificates/video-editing-2026.svg"><img class="cert" src="assets/certificates/digital-marketing-2026.svg">':'');panel.classList.add('open')}close.onclick=()=>panel.classList.remove('open');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>openRoom(b.dataset.room));r.domElement.addEventListener('click',e=>{let x=hit(e);if(x)openRoom(x)});addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});(function a(){requestAnimationFrame(a);o.update();r.render(s,c)})()</script></body></html>
